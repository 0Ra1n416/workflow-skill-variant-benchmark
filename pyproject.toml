# 本文件**只服务于本地开发与测试**。
#
# 运行时依赖以根目录的 requirements.txt 为准 —— cckit 读的是那一份（见 cckit.yaml
# 的 requires.python.file）。这里的 dev 组只是为了让你能在本机跑 `uv run pytest`
# 和 `uv run python`。
#
# 包本体在 workflow-skill-variant-benchmark/scripts/wfbm/，不走安装式布局；
# tests/conftest.py 会把它挂上 sys.path。

[project]
name = "workflow-skill-variant-benchmark-dev"
version = "0.1.0"
description = "Dev-only environment for the workflow-skill-variant-benchmark kit."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 与根目录 requirements.txt 重复，改依赖时两处都要动（本地跑 TUI 需要它）
    "questionary>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
