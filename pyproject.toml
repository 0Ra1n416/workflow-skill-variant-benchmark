[project]
name = "workflow-skill-variant-benchmark"
version = "0.1.0"
description = "Control-variable benchmark harness: compare Skills within a fixed workflow."
requires-python = ">=3.13"
dependencies = ["questionary>=2.0"]

[project.scripts]
wfbm = "wfbm.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfbm"]
